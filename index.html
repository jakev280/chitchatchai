<!DOCTYPE html>
<html lang="en">
  
<head>

  <title>Chit Chat Chai</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">

  <header class="sticky-header">

        <span class="detail-item"><strong>📅 Mon:</strong> 9.30am–11am</span>

    </div>
    <nav class="section-nav" aria-label="Jump to page sections">
      <a href="#introduction-placeholder">Stories</a>
      <a href="#funders-placeholder">Funders</a>

  <img src="images/2022-2.png" alt="Chit Chat Chai 2021 Session" class="header-main-img">

  <div id="introduction-placeholder"></div>
  <div id="funders-placeholder"></div>
  <div id="through-the-years-placeholder"></div>
  <div id="volunteers-placeholder"></div>

  <div id="interactive-placeholder"></div>

  <div id="mobile-story-overlay" class="mobile-story-overlay" aria-hidden="true">

      <button type="button" class="story-close-button" onclick="toggleStoryText()" aria-label="Close story">×</button>
      <div id="mobile-story-inner"></div>
    </div>
  </div>

<footer class="main-footer">
    <div class="footer-content">
        <p>Developed by <strong>Jake Virdee-Reynolds</strong> & <strong>Jason Akrong</strong></p>
